[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boustrophedon-coverage-planning"
version = "0.1.0"
description = "Educational polygon coverage planning with BCD, TSP, and direction-aware GTSP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["shapely>=2.1,<3", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
coverage-plan = "coverage_planning.cli:main"
coverage-benchmark = "coverage_planning.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
